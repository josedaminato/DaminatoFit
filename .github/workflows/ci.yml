name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: daminatofit
          POSTGRES_PASSWORD: daminatofit_dev
          POSTGRES_DB: daminatofit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daminatofit -d daminatofit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://daminatofit:daminatofit_dev@localhost:5432/daminatofit
      DATABASE_URL_APP: postgres://app_user:app_user_dev@localhost:5432/daminatofit
      DATABASE_URL_ADMIN: postgres://app_admin:app_admin_dev@localhost:5432/daminatofit
      BETTER_AUTH_SECRET: ci_only_test_secret_daminatofit_32c
      PUPIAPP_BOOTSTRAP_SECRET: ci_pupiapp_bootstrap
      API_PUBLIC_URL: http://127.0.0.1:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Dependency audit
        run: pnpm deps:audit
      - run: pnpm test
      - name: Resolve app config for every brand
        run: |
          pnpm --filter @daminatofit/mobile config:daminatofit > /dev/null
          pnpm --filter @daminatofit/mobile config:pupiapp > /dev/null
      - run: pnpm --filter @daminatofit/api build

  api-image:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t daminatofit-api:ci .
