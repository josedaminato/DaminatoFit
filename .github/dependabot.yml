version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo SDK packages must move together (`expo install --fix`), never one by one.
      expo:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react', 'react-native', 'react-native-*', 'jest-expo']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/apps/api]
    schedule:
      interval: weekly
