# Local development only. Credentials here are throwaway defaults, never production values.
name: daminatofit

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daminatofit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daminatofit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-daminatofit}
    ports:
      # 5432/5433 are commonly taken by other local projects (e.g. AppMédica).
      - '${POSTGRES_PORT:-5442}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (stand-in for Cloudflare R2 / Backblaze B2).
  storage-permissions:
    image: alpine:3.24.4
    volumes:
      - storage_data:/data
    command: ['chown', '-R', '10001:10001', '/data']
    restart: 'no'

  storage:
    image: rustfs/rustfs:1.0.6
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-daminatofit}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-daminatofit_dev_secret}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  storage-init:
    image: amazon/aws-cli:2.42.1
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-daminatofit}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-daminatofit_dev_secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-daminatofit-media}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$BUCKET"
    restart: 'no'

  # Catches outgoing e-mail (invitations, password resets). Web UI on port 8025.
  mail:
    image: axllent/mailpit:v1.34.0
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAIL_UI_PORT:-8025}:8025'

  api:
    profiles: ['api']
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: info
    ports:
      - '${API_PORT:-3000}:3000'

volumes:
  postgres_data:
  storage_data:
